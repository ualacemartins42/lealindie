# Impede a pausa automática do projeto Supabase no plano Free
# (inatividade de 7 dias). Roda a cada 3 dias e também pode ser disparado
# manualmente em Actions → Keep Supabase Alive → Run workflow.
#
# Secrets necessários no repositório (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       — https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  — chave anon/publishable

name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query get_site_metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Configure os secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositório."
            exit 1
          fi

          BASE_URL="${SUPABASE_URL%/}"
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          # RPC pública e somente leitura — as tabelas não têm SELECT para anon.
          STATUS="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            -X POST "${BASE_URL}/rest/v1/rpc/get_site_metrics" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{}')"

          echo "HTTP status: ${STATUS}"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Falha ao pingar o Supabase (HTTP ${STATUS})."
            exit 1
          fi

          echo "Supabase está ativo."
